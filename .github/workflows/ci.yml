name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # Installs the standalone pnpm binary and the Node version declared in
      # package.json → devEngines.runtime. No actions/setup-node, no npm.
      - uses: pnpm/setup@v1
        with:
          cache: true

      # Previously (replaced by pnpm/setup — kept for reference):
      # - uses: actions/setup-node@v6
      #   with:
      #     node-version: 22
      #     cache: 'npm'
      # - run: npm ci

      - name: Typecheck
        run: pnpm exec tsc --noEmit

      - name: Lint
        run: pnpm exec oxlint src/

      - name: Format check
        run: pnpm exec oxfmt --check src/

      # The configs this repo ships are most of it, and tsc/oxlint only see
      # src/. pwsh is preinstalled on the runner; fish and lua are not.
      - name: Install config parsers
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends fish lua5.4

      - name: Config syntax
        run: node scripts/check-configs.mjs

      - name: Build
        run: pnpm run build
