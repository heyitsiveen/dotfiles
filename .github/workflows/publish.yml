name: Publish to npm

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # Installs the standalone pnpm binary and the Node version declared in
      # package.json → devEngines.runtime. No actions/setup-node, no npm.
      - uses: pnpm/setup@v1
        with:
          cache: true

      # Previously (replaced by pnpm/setup — kept for reference):
      # - uses: actions/setup-node@v6
      #   with:
      #     node-version: 24
      #     registry-url: 'https://registry.npmjs.org'
      #     cache: 'npm'
      # - run: npm ci

      - name: Typecheck
        run: pnpm exec tsc --noEmit

      - name: Lint
        run: pnpm exec oxlint src/

      - name: Format check
        run: pnpm exec oxfmt --check src/

      - name: Build
        run: pnpm run build

      # Authenticates via OIDC Trusted Publishing (permissions.id-token: write).
      # No NPM_TOKEN. OIDC publishing regressed in pnpm 11.0.8 and was fixed in
      # pnpm/pnpm#11526 — this repo pins pnpm 11.17.0 via packageManager.
      - run: pnpm publish --access public --no-git-checks

      # Fallback if pnpm's OIDC handshake ever breaks again — restore the
      # actions/setup-node step above (it provides the npm CLI + registry-url):
      # - run: npm publish --access public
